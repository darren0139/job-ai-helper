name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install application dependencies
        run: python -m pip install -r requirements.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Compile core modules
        shell: bash
        run: |
          python -m py_compile app.py
          python -m py_compile analysis_stability/stable_evidence_scoring.py
          python -m py_compile tailoring/project_section_tailor.py
          python -m py_compile tailoring/skills_section_tailor.py
          python -m py_compile tailoring/stable_tailoring_ranking.py
          python -m py_compile tailoring/deterministic_bullet_allocation.py
          python -m py_compile resume_builder/evidence_aware_fitting.py
          python -m py_compile resume_builder/fitting_render_optimizer.py
          python -m py_compile resume_builder/docx_projects_skills_replacer.py
          python -m py_compile scripts/check_stable_analysis.py
          python -m py_compile scripts/run_analysis_stability_trial.py
          python -m py_compile scripts/run_tailoring_stability_trial.py
          python -m py_compile scripts/benchmark_models.py
          python -m py_compile scripts/migrate_jd_identity.py
          python -m py_compile scripts/inspect_jd_identity.py
          python -m py_compile database/jd_library_manager.py
          python -m py_compile database/tailoring_version_manager.py
          python -m py_compile rag/jd_identity.py
          python -m py_compile rag/jd_chroma_rag.py

      - name: Run unit and regression tests
        run: python -m unittest discover -s tests -v

  streamlit-smoke:
    name: Streamlit startup smoke test
    runs-on: ubuntu-latest
    needs: python-tests

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Start Streamlit and check health endpoint
        shell: bash
        run: |
          set -euo pipefail
          python -m streamlit run app.py \
            --server.headless true \
            --server.port 8501 \
            > streamlit-ci.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health; then
              exit 0
            fi
            sleep 2
          done

          cat streamlit-ci.log
          exit 1

      - name: Upload startup log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: streamlit-ci-log
          path: streamlit-ci.log
